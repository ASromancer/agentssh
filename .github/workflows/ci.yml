name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - name: e2e against a real OpenSSH server
        if: runner.os != 'Windows'
        run: |
          command -v sshd || sudo apt-get install -y openssh-server
          go build -tags e2efake -o "$RUNNER_TEMP/agentssh-e2e" .
          python3 scripts/e2e.py "$RUNNER_TEMP/agentssh-e2e"
  build-unix-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/ASromancer/agentssh/internal/cli.Version=${GITHUB_REF_NAME#v}" \
              -o dist/agentssh-$os-$arch$ext .
          done
      - name: release binaries contain no e2e test hooks
        run: |
          for f in dist/*; do
            n=$(grep -a -c -e AGENTSSH_E2E_HUMANOK -e AGENTSSH_E2E_NOTES "$f" || true)
            echo "$f: $n"; [ "$n" = 0 ]
          done
      - uses: actions/upload-artifact@v4
        with: { name: dist-other, path: dist/ }
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for arch in amd64 arm64; do
            cc_arch=$([ $arch = amd64 ] && echo x86_64 || echo arm64)
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch CC="clang -arch $cc_arch" go build -trimpath \
              -ldflags "-s -w -X github.com/ASromancer/agentssh/internal/cli.Version=${GITHUB_REF_NAME#v}" \
              -o dist/agentssh-darwin-$arch .
          done
      - name: release binaries contain no e2e test hooks
        run: |
          for f in dist/*; do
            n=$(grep -a -c -e AGENTSSH_E2E_HUMANOK -e AGENTSSH_E2E_NOTES "$f" || true)
            echo "$f: $n"; [ "$n" = 0 ]
          done
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/ }
  release:
    needs: [build-unix-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && ls -l
      - uses: actions/upload-artifact@v4
        with: { name: agentssh, path: dist/ }
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
